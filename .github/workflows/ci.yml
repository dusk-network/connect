name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  ci:
    name: Build and test
    runs-on: core
    timeout-minutes: 15
    # Do not expose the self-hosted core runner to fork PRs, and skip draft PRs.
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository) }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Validate package release ages
        shell: bash
        run: node scripts/verify-package-release-ages.js --days 0.5

      - name: Pin npm
        shell: bash
        run: npm install --global npm@11.18.0 --ignore-scripts
        working-directory: ${{ runner.temp }}

      - name: Install dependencies without lifecycle scripts
        shell: bash
        run: npm ci --ignore-scripts

      - name: Verify registry signatures
        shell: bash
        run: npm audit signatures

      - name: Run CI checks
        shell: bash
        run: npm run ci

      - name: Validate published package
        shell: bash
        run: npm pack --dry-run --allow-directory=all
